<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="776" viewBox="0 0 375 776" role="img" aria-label="Results screen, compact cards variant">
  <title>Data Tool – Results screen, compact cards variant</title>
  <style>
    svg {
      --surface: #ffffff; --surface-2: #f5f5f3; --text: #1a1a19; --muted: #6b6b65;
      --line: #d5d5d0; --strong: #242422; --on-strong: #ffffff;
      --success: #276749; --success-soft: #edf7f1; --danger: #9a3412; --danger-soft: #fff7ed;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --surface: #111111; --surface-2: #1d1d1b; --text: #f3f3ef; --muted: #aaa9a2;
        --line: #41413d; --strong: #eeeeea; --on-strong: #171716;
        --success: #86efac; --success-soft: #13251b; --danger: #fdba74; --danger-soft: #2b1b12;
      }
    }
    text { fill: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .frame { fill: none; stroke: var(--line); }
    .bg { fill: var(--surface); }
    .bg2 { fill: var(--surface-2); }
    .card { fill: var(--surface); stroke: var(--line); }
    .card2 { fill: var(--surface-2); stroke: var(--line); }
    .strong { fill: var(--strong); stroke: var(--strong); }
    .dsoft { fill: var(--danger-soft); }
    .dcard { fill: var(--danger-soft); stroke: var(--line); }
    .ssoft { fill: var(--success-soft); }
    .hr { stroke: var(--line); }
    .dot { fill: var(--strong); }
    text.mu { fill: var(--muted); }
    text.on { fill: var(--on-strong); }
    text.dg { fill: var(--danger); }
    text.ok { fill: var(--success); }
    .s10 { font-size: 10px; } .s11 { font-size: 11px; } .s12 { font-size: 12px; } .s13 { font-size: 13px; }
    .s14 { font-size: 14px; } .s16 { font-size: 16px; } .s20 { font-size: 20px; }
    .w5 { font-weight: 500; } .w6 { font-weight: 600; }
    .eb { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; fill: var(--muted); }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
    .ic { color: var(--text); } .ic-mu { color: var(--muted); } .ic-on { color: var(--on-strong); }
    .ic-dg { color: var(--danger); } .ic-ok { color: var(--success); }
  </style>
  <defs>
    <symbol id="i-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M7 12h10"/><path d="M10 18h4"/></symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></symbol>
    <symbol id="i-package" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
    <symbol id="i-layout-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 4h7"/><path d="M14 9h7"/><path d="M14 15h7"/><path d="M14 20h7"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
  </defs>
        <defs><clipPath id="clip-r4"><rect x="0.5" y="0.5" width="374" height="775" rx="28"/></clipPath></defs>
        <g clip-path="url(#clip-r4)">
          <rect class="bg" width="375" height="776"/>

          <!-- Top bar -->
          <use href="#i-arrow-left" class="ic" x="18" y="27" width="22" height="22"/>
          <text class="s20 w5" x="58" y="38">Results</text>
          <text class="s11 mu" x="58" y="56">4 items from latest run</text>
          <use href="#i-more" class="ic" x="335" y="27" width="22" height="22"/>
          <line class="hr" x1="0" y1="76.5" x2="375" y2="76.5"/>

          <!-- Search + filter -->
          <rect class="card2" x="14.5" y="88.5" width="346" height="43" rx="11"/>
          <use href="#i-search" class="ic-mu" x="26" y="102" width="16" height="16"/>
          <text class="s14 mu" x="50" y="115">Search title or ID</text>
          <line class="hr" x1="290.5" y1="94" x2="290.5" y2="126"/>
          <use href="#i-filter" class="ic-mu" x="300" y="103" width="14" height="14"/>
          <text class="s11 mu" x="318" y="114">Filter</text>

          <!-- Run summary -->
          <rect class="bg2" x="14" y="142" width="347" height="60" rx="11"/>
          <text class="s16 w5" x="25" y="168">3</text>
          <text class="s10 mu" x="25" y="184">Completed</text>
          <text class="s16 w5" x="135" y="168">1</text>
          <text class="s10 mu" x="135" y="184">Error</text>
          <rect class="card" x="253.5" y="153.5" width="96" height="37" rx="9"/>
          <use href="#i-rotate" class="ic" x="264" y="166" width="12" height="12"/>
          <text class="s10 w5" x="281" y="176">Retry errors</text>

          <!-- Compact card 1 -->
          <rect class="card" x="14.5" y="214.5" width="346" height="101" rx="14"/>
          <rect class="bg2" x="24" y="229" width="52" height="72" rx="9"/>
          <use href="#i-package" class="ic-mu" x="40" y="255" width="20" height="20"/>
          <text class="s14 w5" x="86" y="246">MicroSplat</text>
          <circle class="ssoft" cx="300" cy="241" r="10"/>
          <use href="#i-check" class="ic-ok" x="294" y="235" width="12" height="12"/>
          <text class="s11 mu" x="86" y="266">96478 · Unity Asset Store</text>
          <text class="s10 mu" x="86" y="288">Jason Booth · Tools / Terrain</text>
          <use href="#i-more" class="ic-mu" x="326" y="256" width="18" height="18"/>

          <!-- Compact card 2 -->
          <rect class="card" x="14.5" y="325.5" width="346" height="101" rx="14"/>
          <rect class="bg2" x="24" y="340" width="52" height="72" rx="9"/>
          <use href="#i-package" class="ic-mu" x="40" y="366" width="20" height="20"/>
          <text class="s14 w5" x="86" y="357">Terrain Composer 2</text>
          <circle class="ssoft" cx="300" cy="352" r="10"/>
          <use href="#i-check" class="ic-ok" x="294" y="346" width="12" height="12"/>
          <text class="s11 mu" x="86" y="377">65563 · Unity Asset Store</text>
          <text class="s10 mu" x="86" y="399">Nathaniel Doldersum · Tools / Terrain</text>
          <use href="#i-more" class="ic-mu" x="326" y="367" width="18" height="18"/>

          <!-- Compact card 3 -->
          <rect class="card" x="14.5" y="436.5" width="346" height="101" rx="14"/>
          <rect class="bg2" x="24" y="451" width="52" height="72" rx="9"/>
          <use href="#i-package" class="ic-mu" x="40" y="477" width="20" height="20"/>
          <text class="s14 w5" x="86" y="468">Gaia Pro</text>
          <circle class="ssoft" cx="300" cy="463" r="10"/>
          <use href="#i-check" class="ic-ok" x="294" y="457" width="12" height="12"/>
          <text class="s11 mu" x="86" y="488">155852 · Unity Asset Store</text>
          <text class="s10 mu" x="86" y="510">Procedural Worlds · Tools / Terrain</text>
          <use href="#i-more" class="ic-mu" x="326" y="478" width="18" height="18"/>

          <!-- Compact card 4 (error) -->
          <rect class="dcard" x="14.5" y="547.5" width="346" height="101" rx="14"/>
          <rect class="bg2" x="24" y="562" width="52" height="72" rx="9"/>
          <use href="#i-alert" class="ic-mu" x="40" y="588" width="20" height="20"/>
          <text class="s14 w5" x="86" y="579">Package 99101</text>
          <circle class="dsoft" cx="300" cy="574" r="10" style="stroke:var(--danger);stroke-opacity:.25"/>
          <use href="#i-x" class="ic-dg" x="294" y="568" width="12" height="12"/>
          <text class="s11 mu" x="86" y="599">99101 · Unity Asset Store</text>
          <text class="s10 mu" x="86" y="621">HTTP timeout <tspan dx="6" class="w5" style="fill:var(--danger)">Retry</tspan></text>
          <use href="#i-more" class="ic-mu" x="326" y="589" width="18" height="18"/>

          <!-- Export FAB -->
          <rect class="strong" x="255" y="652" width="104" height="46" rx="23" style="filter:drop-shadow(0 7px 10px rgb(0 0 0 / .2))"/>
          <use href="#i-download" class="ic-on" x="271" y="667" width="16" height="16"/>
          <text class="s12 w5 on" x="294" y="679">Export</text>

          <!-- Bottom nav -->
          <rect class="bg" x="0" y="710" width="375" height="66"/>
          <line class="hr" x1="0" y1="710.5" x2="375" y2="710.5"/>
          <use href="#i-inbox" class="ic-mu" x="52.5" y="722" width="20" height="20"/>
          <text class="s11 mu mid" x="62.5" y="758">Collect</text>
          <use href="#i-layout-list" class="ic" x="177.5" y="722" width="20" height="20"/>
          <text class="s11 w5 mid" x="187.5" y="758">Results</text>
          <use href="#i-settings" class="ic-mu" x="302.5" y="722" width="20" height="20"/>
          <text class="s11 mu mid" x="312.5" y="758">Settings</text>
        </g>
        <rect class="frame" x="0.5" y="0.5" width="374" height="775" rx="28"/>
      </svg>
