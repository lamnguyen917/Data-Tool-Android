project to another level. Azure[Sky] is not only suitable for projects with realistic graphics, in fact, this system is just as good or even better for projects with stylized graphics. You can achieve the best of each graphic style using Azure[Sky]. And its powerful sky system is turning 10 years of completely free updates here in the Asset Store, thus making it the best cost benefit in its category.</p></br><p >Please, do not leave before test the demo scene to see some features in action.</p><p ><strong>Windows Demo:</strong> <a href=\"https://drive.google.com/file/d/1aL5B8f0p59xB4krXhGNxNwF595Sjwo8B/view?usp=sharing\" target=\"_blank\">Download Link</a></p></br></br><p ><strong>Supported Render Pipelines:</strong></p><ul><li >Legacy: Yes</li><li >Universal: Yes</li><li >HDRP: No</li></ul></br><p ><strong>Performance:</strong></p><p >The performance is a factor taken very seriously in the development of the asset, and each feature was carefully planned to get the best performance as possible. It is not a tool targeted for mobile devices, but due to its complexity and purpose, you will not find another tool that offers all the features with the best performance as you can get using Azure[Sky].</p></br><p ><strong>Sky System:</strong></p><p >The sky system is physically based, it supports a complete and dynamic day-night cycle. Azure[Sky] works as a skybox material, so you will get full advantage of Unity's lighting system that uses the sky color to achieve the best scene lighting. The skybox supports rendering realistic stars, Milk Way and constellations.</p></br><p ><strong>Fog System:</strong></p><p >The fog scattering effect is one of the most amazing features of the asset, the effect adds a lot of realism to the scene and smoothly blends your scene with the skybox. The plugin supports Global and Height fog, and the package includes instructions on how to edit your custom transparent shaders to implement support to the fog scattering effect.</p></br><p >In the documentation you will find instructions on how to make the fog scattering work properly with <strong>Lux Water</strong>, <strong>Aquas Water</strong>, <strong>Crest Ocean System</strong>, <strong>KWS Water System</strong>, etc...</p></br><p ><strong>Time System:</strong></p><p >Azure[Sky] provides a complete time system with a lot of options. It supports the accurate position of the sun and moon in the sky based on time, date and geographic location (latitude and longitude), the moon phases are accurate with automatic adjustment according to its position and time of day. You can change the length of the day to make the daytime last longer than the night or vice-versa, it also provides a complete calendar directly in the Inspector for easier navigation and selection of dates.</p></br><p ><strong>Weather System:</strong></p><p >The Weather System of Azure[Sky] is the most complete weather system you will find, believe me, there is nothing that can be compared to it.</p></br><p >You can literally add/create new custom 'Weather Properties' to the weather system by just pressing a button, then configure this weather property to be a FloatSlider, Colorfield, Curve or even a Gradient, etc... This new weather property will appear in the weather presets for customization where you can set its values according to the time of day or even set a different configuration to it according to the weather preset you want to simulate.</p></br><p >The weather system will performs all the weather blends and transitions, and uses the output value of this weather property to control variables from other scripts using the 'Override System' without you having to write a single line of code. You can also arrange the custom weather properties in groups, so it became easy to organize all your weather properties according to its categories.</p></br><p >Changing the weather conditions at runtime is very simple, you can create a list of weather presets with a variety of different weather settings (<em>Sunny, Rain, Snow, etc...</em>). Then you can easily change the weather and all your scene settings by switching from one weather preset to another automatically using the global and local weather system. The weather system also provides a lightning effect and a complete sound/particle FX to simulate rain, wind, and thunderstorms. By default Azure[Sky] comes with a list of weather presets already configured to use.</p></br><p ><strong>Local Weather Zones:</strong></p><p >Azure[Sky] also supports local weather zones, you can create a variety of different weather zones around the map, and as the player moves around the scene, the weather automatically changes according to each region.</p></br><p ><strong>Event System:</strong></p><p >Azure[Sky] comes with a powerful event system completely integrated with the time of day and Unity's Event System. There is also the AzureNotificationCenter class that handles a lot of useful events that you can use to integrate the Azure[Sky] logic with your game logic.</p></br><p ><strong>Cloud System:</strong></p><p >Azure provides a dynamic cloud system with excellent performance and fully integrated with the weather system. You can also disable the clouds to only use the background sky if you want to use some third-party cloud shader.</p></br><p ><strong>Curves and Gradients:</strong></p><p >Azure[Sky] was the first sky system to introduce the intensive use of curves and gradients to extend the asset customization power. It is possible to configure the custom 'Weather Properties' to be customized as curves and gradients, so you can set different values to the properties at any time of the day, providing total control over all the properties in your scene.</p></br><p ><strong>Override System:</strong></p><p >The Override System is another innovation introduced by Azure[Sky]. You can configure it to get the output values from the custom 'Weather Properties' and use it to control variables from other scripts/components without having to write a single line of code. This feature is integrated with the 'Weather Properties' and the 'Weather System', and you can use it to integrate any sort of thing from your scene that need to work with the weather system.</p></br><p ><strong>Additional Features:</strong></p><ul><li >Supports Linear and Gamma Color Spaces.</li><li >Supports All Rendering Paths.</li><li >All C# Source Code Available.</li></ul></br><p ><strong>Important Warnings:</strong></p><ul><li >The asset is not targeted to mobile devices.</li><li >Currently, the sky system does not support HDRP.</li><li >The sky system does not support volumetric clouds and volumetric lights.</li><li >Not compatible with VRChat.</li><li >Not tested on VR, so I do not know if it works with Single-Pass Instanced Rendering.</li><li >Some assets from the images, videos and demo scenes belong to other Asset Store packages and are not included with this package.</li></ul></br><p ><strong>3rd party assets used in the showcases:</strong></p><ul><li ><a href=\"https://assetstore.unity.com/packages/tools/terrain/horizon-on-31861\" target=\"_blank\">Horizon[ON]</a></li><li ><a href=\"https://assetstore.unity.com/packages/3d/environments/tropical-forest-pack-49391\" target=\"_blank\">Tropical Forest Pack</a></li><li ><a href=\"https://assetstore.unity.com/packages/vfx/shaders/advanced-foliage-shaders-v-5-68907\" target=\"_blank\">Advanced Foliage Shaders v.5</a></li><li ><a href=\"https://github.com/wave-harmonic/crest\" target=\"_blank\">Crest GitHub Version</a></li><li ><a href=\"https://unity.com/pt/demos/urp-3d-sample\" target=\"_blank\">Unity URP Oasis Sample</a></li></ul></br><p ><strong>Support:</strong> <a href=\"http://forum.unity3d.com/threads/azure-sky-time-of-day-dinamic-skybox.322773/\" target=\"_blank\">Forum Thread</a></p><p ><strong>E-mail:</strong> sevenstarsgames@gmail.com</p>","aiDescription":"","elevatorPitch":"","keyFeatures":"","compatibilityInfo":"","srps":[{"version":"2021.3.43f1","types":["stand //assetstorev1-prd-cdn.unity3d.com/package-screenshot/4352d0d8-5fb3-42b4-995c-0405885b2bfb_scaled.jpg","thumbnailUrl":"//assetstorev1-prd-cdn.unity3d.com/package-screenshot/4352d0d8-5fb3-42b4-995c-0405885b2bfb_thumb.jpg","__typename":"ProductImage"},{"type":"screenshot","imageUrl":"//assetstorev1-prd-cdn.unity3d.com/package-screenshot/b0a9502f-9168-4927-b28d-37ef088cb7c3_scaled.jpg","thumbnailUrl":"//assetstorev1-prd-cdn.unity3d.com/package-screenshot/b0a9502f-9168-4927-b28d-37ef088cb7c3_thumb.jpg","__typename":"ProductImage"}],"category":{"type":"id","id":["Category","108"]},"firstPublishedDate":"2015-05-14T22:41:13Z","publishNotes":"<p >Important:</p><ul><li >Download the asset using Unity 2022.3.0f1 LTS or higher to get the 8x version cycle.</li><li >Download the asset using Unity 2021.3.43f1 LTS or higher to get the old 7x version cycle.</li></ul><p >Update v8.0.8</p><ul><li >The 2D static cloud system from 7.x.x version cycle has been added back to the 8.x.x version cycle.</li></ul></br><p >Update v8.0.7</p><ul><li >The support for the obsolete Render Graph Compatibility Mode, which was triggering errors in the universal render pipeline when using Unity 6.4, has been removed from the AzureFogScatteringFeature.cs file, as it is no longer supported by this version of Unity. Therefore, if you are using the universal render pipeline in Unity 6.4 or higher, use the replacement package called \"URP_17_4_0_for_Unity_6_4\" instead of the old ones.</li></ul></br><p >Update v8.0.6</p><ul><li >Fixed the issue in the fog scattering renderer feature that was not requiring the depth texture while rendering the fog when using Unity 6 and URP version 17.0.3.</li></ul></br><p >Update v8.0.5</p><ul><li >Now the fog scattering effect can get a more accurate blue color hue along the distance, you can control its intensity by setting the property \"Fog Bluish Intensity\" located in the \"Fog Scattering\" tab of the \"AzureSkyRenderer\" component.</li></ul></br><p >Update v8.0.4</p><ul><li >Fixed the URP_17_0_3 replacement package for Unity 6 to fix a issue in the fog scattering renderer feature that is triggered when the Scene window is active in the Editor causing several console errors.</li></ul></br><p >Update v8.0.3</p><ul><li >Fixed the URP_17_0_3 replacement package for Unity 6 to fix fog scattering issues caused by some change in the URP's API of the last Unity 6 LTS released. Unfortunately, this required the feature available to set a low resolution of the fog scattering texture to be temporarily removed when using URP in Unity 6.</li></ul></br><p >Update v8.0.2</p><ul><li >Fixed build error when using Unity 6 and Universal RP.</li></ul></br><p >Update v8.0.1</p><ul><li >Added RecordRenderGraph implementation to AzureFogScatteringFeature. Now it supports RenderGraph when using Unity 6 and Universal RP v17.0.3.</li></ul></br><p >New Version Cycle: v8.0.0</p><ul><li >Remake completely from scratch.</li><li >Not Retrocompatible with version cycle 7x.</li><li >Not Retrocompatible with the 8x Beta versions.</li><li >Always save a backup of your project before updating.</li></ul></br><p >What is new:</p><ul><li >Huge performance boost using the new Core Update Event feature.</li><li >New custom Weather Property System.</li><li >New Weather Property Groups.</li><li >New AzureCoreSystem component.</li><li >Improved Time System (<em>integrated into the AzureCoreSystem</em>).</li><li >Improved Weather System (<em>integrated into the AzureCoreSystem</em>).</li><li >Event System is now integrated into the AzureCoreSystem component.</li><li >New Core Update Event feature used to refresh the entire system in time intervals to save performance.</li><li >Option to Set the Fog Scattering Effect resolution to improve performance.</li><li >The skybox now sopports constallation rendering.</li><li >Simple Volumetric Light System for prototyping (<em>Point and Spot light Only</em>).</li><li >Lots of bug fixes.</li><li >New Demo Scene.</li><li >New improved C# Code.</li><li >New Documentation.</li><li >The package is now placed inside the \"Plugins\" folder.</li></ul>","supportedUnityVersions":["2021.3.43","2022.3.0"],"state":"published","overlay":"","overlayText":"","popularTags":[{"type":"id","id":["ProductTag","275102364123"]},{"type":"id","id":["ProductTag","277071147352"]},{"type":"id","id":["ProductTag","277071147350"]},{"type":"id","id":["ProductTag","277071147348"]},{"type":"id","id":["ProductTag","277071147347"]},{"type":"id","id":["ProductTag","277071147346"]},{"type":"id","id":["ProductTag","278495129613"]},{"type":"id","id":["ProductTag","278495129612"]},{"type":"id","id":["ProductTag","278495129611"]},{"type":"id","id":["ProductTag","278495129609"]},{"type":"id","id":["ProductTag","279181021320"]},{"type":"id","id":["ProductTag","279181021319"]},{"type":"id","id":["ProductTag","279181021318"]},{"type":"id","id":["ProductTag","279181021317"]},{"type":"id","id":["ProductTag","279181021316"]}],"plusProSale":false,"licenseText":"","vspProperties":{"__typename":""},"packageType":"unitypackage","__typename":"Product","upgrades":null,"dependencyIds":[],"dependencies":[],"customLicense":false,"packageInListHotness":2198}},"ProductVersion":{"1517808":{"id":"1517808","name":"8.0.8","publishedDate":"2026-10-19T21:20:14Z","__typename":"ProductVersion"}},"ProductPublisher":{"13035":{"id":"13035","name":"7stars","url":"https://www.artstation.com/sevenstarsgames","supportUrl":"","supportEmail":"sevenstarsgames@gmail.com","gaAccount":"","gaPrefix":"","__typename":"ProductPublisher"}},"ProductTag":{"275102364123":{"id":"275102364123","pTagId":"275036069973","name":"Sky","__typename":"ProductTag"},"277071147352":{"id":"277071147352","pTagId":"275036069975","name":"Weather","__typename":"ProductTag"},"277071147350":{"id":"277071147350","pTagId":"275036069982","name":"Fog","__typename":"ProductTag"},"277071147348":{"id":"277071147348","pTagId":"275036049461","name":"Lighting","__typename":"ProductTag"},"277071147347":{"id":"
