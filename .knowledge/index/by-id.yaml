    optional Japanese fallback, and fixture-based Android coverage.
  open_when:
    - heyzo adapter
    - heyzo crawl
    - heyzo moviepages
    - heyzo android migration

caribbeancom-adapter-research:
  title: Caribbeancom adapter — source research and Android migration guide
  path: pages/caribbeancom-adapter-research.md
  source: sources/caribbeancom-adapter-observations.md
  status: implemented
  summary: >
    Strict MMDDYY-NNN and trusted product-URL resolution, fixed English and Japanese
