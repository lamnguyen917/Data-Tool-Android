# Wiki index (by id)
# AI: resolve `id` → open `path` under `.knowledge/`.

unity-crawl:
  title: Unity Asset Store — crawl
  path: pages/unity-asset-store-crawl.md
  source: sources/unity-asset-store-observations.md
  status: verified
  summary: >
    HTML crawl via /packages/unknown/{id} redirects; parse embedded
    ReactDOMrender ENTITY state + ld+json; unknown id → 200 home page;
    keyword search via /search?q= RSC payload (Coveo results);
    GraphQL unusable without browser CSRF.
  open_when:
    - asset store crawl
    - package id resolve
    - graphql csrf

amazon-book-crawl:
  title: Amazon — book product crawl
  path: pages/amazon-book-crawl.md
  source: sources/amazon-book-observations.md
  status: verified
  summary: >
    HTML crawl via /dp/{ASIN}; slug optional; parse productTitle, bylineInfo,
    detailBullets; watch for bot-block pages.
  open_when:
    - amazon book crawl
    - asin isbn resolve
    - amazon dp url

steam-crawl:
  title: Steam Store — crawl
  path: pages/steam-store-crawl.md
  source: sources/steam-store-observations.md
  status: verified
  summary: >
    Prefer /api/appdetails JSON by AppID; slug optional on /app/{id}/;
    developers/publishers/release from API; Series/Distributor usually empty;
    keyword search via /api/storesearch.
  open_when:
    - steam store crawl
    - steam appid
    - steam developer publisher
    - steam search

igdb-crawl:
  title: IGDB — crawl
  path: pages/igdb-crawl.md
  source: sources/igdb-observations.md
  status: verified
  summary: >
    IGDB API v4 POST /games with Twitch Bearer token; public /games/{slug} URLs;
    involved_companies for dev/publisher; release_dates; no Distributor field;
    www HTML blocked by Cloudflare.
  open_when:
    - igdb crawl
    - igdb slug
    - igdb api apicalypse
    - igdb search

rust-desktop-adapters:
  title: Rust desktop adapters — implementation reference
  path: pages/rust-desktop-adapters.md
  source: sources/rust-desktop-adapter-observations.md
  status: source-reviewed
  summary: >
    Source-reviewed behavior, endpoints, selectors, field mappings, localization,
    tests, and known limitations for nine adapters registered in the sibling Rust
    desktop application. Ave, Tokyo-Hot, and Heyzo now have dedicated Android implementations.
  open_when:
    - rust adapter migration
    - ave adultempire avfantasy
    - carib caribpr heyzo
    - 1pondo thirdworldmedia tokyo-hot

ave-adapter-research:
  title: Ave adapter — source research and Android migration guide
  path: pages/ave-adapter-research.md
  source: sources/ave-adapter-observations.md
  status: implemented
  summary: >
    Dedicated source research for the Rust Ave adapter: strict input resolution,
    candidate search, exact SKU matching, English and Japanese HTML parsing,
    cache and validation risks, Android field mapping, and fixture test plan.
  open_when:
    - ave adapter
    - aventertainments crawl
    - ave android migration
    - ave search parsing

tokyo-hot-adapter-research:
  title: Tokyo-Hot adapter — live research and Android implementation
  path: pages/tokyo-hot-adapter-research.md
  source: sources/tokyo-hot-adapter-observations.md
  status: implemented
  summary: >
    Live-verified Tokyo-Hot search and bilingual product parsing, exact Product ID
    resolution for n0001, field mapping, trusted URL rules, error policy, and tests.
  open_when:
    - tokyo-hot adapter
    - tokyo-hot n0001
    - tokyo-hot search
    - tokyo-hot localization

fc2-adapter-research:
  title: FC2 adapter — live article research and implementation guide
  path: pages/fc2-adapter-research.md
  source: sources/fc2-adapter-observations.md
  status: implemented
  summary: >
    Implemented FC2 article collection for numeric SKU 4871322: Product JSON-LD,
    supplemental DOM fields, desktop user-agent requirement, session-bound
    description iframe, soft not-found pages, unsupported anonymous search,
    field mapping, fixtures, and live verification.
  open_when:
    - fc2 adapter
    - fc2 ppv
    - fc2 article 4871322
    - fc2 content market

heyzo-adapter-research:
  title: Heyzo adapter — source research and Android migration guide
  path: pages/heyzo-adapter-research.md
  source: sources/heyzo-adapter-observations.md
  status: implemented
  summary: >
    Implemented four-digit SKU and trusted product-URL resolution, fixed English and
